biography: |
  Hi, I'm Soto Anno (安納 爽響), a researcher at [Network Service Systems Laboratories, NTT, Inc.](https://www.rd.ntt/e/ns/overview/), 
  
  I'm working on building data-driven methods for understanding real-world environments, spanning urban dynamics, human mobility, and vehicular communications.
  
  I obtained a Ph.D. degree from the Department of Computer Science at 
  [Science Tokyo](https://www.isct.ac.jp/en), advised by 
  [Prof. Masamichi Shimosaka](http://www.miubiq.comp.isct.ac.jp/). 
  During my Ph.D. journey, I served as JSPS Research Fellow (DC1) (2022-2025). 
  I also interned at Yahoo! JAPAN Research (2020-2024).

  My broader interests include machine learning, deep learning, big data analysis,
  geographic information systems, context-aware computing, and computer vision.
research_statement: >-
  I study data-driven methods for understanding real-world environments, spanning urban dynamics, human mobility, and vehicular communications.
research_interests:
  - title: Urban Intelligence
    description: Data-driven understanding and modeling of cities, human mobility, and activities in urban environments.
  - title: Networked Mobility
    description: Reliable cellular and multipath communication for connected and teleoperated vehicles.
  - title: Machine Learning
    description: Learning from large-scale mobility, search, visual, geographic, and network measurements.
  - title: Spatial Computing
    description: Geographic information systems, urban computing, context-aware computing, and computer vision.
